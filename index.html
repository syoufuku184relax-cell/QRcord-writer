<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ロゴ・タイトル付きQRコード作成アプリ</title>
  <!-- QRCode.js ライブラリ (CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f4f6f9;
      color: #333;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      max-width: 900px;
      width: 100%;
      background: #fff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 25px;
    }
    @media (max-width: 768px) {
      .container {
        grid-template-columns: 1fr;
      }
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 20px;
      grid-column: 1 / -1;
      color: #2c3e50;
      border-bottom: 2px solid #eee;
      padding-bottom: 10px;
    }
    .settings-panel {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    label {
      font-size: 0.875rem;
      font-weight: bold;
      color: #4a5568;
    }
    input[type="text"], input[type="file"], input[type="range"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      font-size: 0.95rem;
    }
    input[type="range"] {
      padding: 0;
    }
    .range-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: #718096;
    }
    .preview-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      background: #fafafa;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
    }
    .preview-title {
      font-weight: bold;
      margin-bottom: 15px;
      color: #4a5568;
    }
    canvas {
      max-width: 100%;
      height: auto;
      border: 1px solid #cbd5e0;
      border-radius: 4px;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .download-btn {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      background-color: #3182ce;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .download-btn:hover {
      background-color: #2b6cb0;
    }
    /* 非表示のQRコード保持要素 */
    #qrcode-hidden {
      display: none;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>QRコード作成ツール (ロゴ・タイトル入り)</h1>

  <!-- 設定入力エリア -->
  <div class="settings-panel">
    <div class="form-group">
      <label for="qr-text">QRコードの内容 (URLやテキスト)</label>
      <input type="text" id="qr-text" value="https://example.com" placeholder="https://example.com">
    </div>

    <div class="form-group">
      <label for="title-top-left">左上のタイトル（欄外）</label>
      <input type="text" id="title-top-left" value="Sample Title" placeholder="左上に表示するテキスト">
    </div>

    <div class="form-group">
      <label for="title-bottom-right">右下のタイトル（欄外）</label>
      <input type="text" id="title-bottom-right" value="Sub Text" placeholder="右下に表示するテキスト">
    </div>

    <div class="form-group">
      <label for="logo-file">中央ロゴ画像</label>
      <input type="file" id="logo-file" accept="image/*">
    </div>

    <div class="form-group">
      <div class="range-label">
        <label for="logo-size">ロゴサイズ調整</label>
        <span id="logo-size-val">20%</span>
      </div>
      <input type="range" id="logo-size" min="10" max="28" value="20">
    </div>

    <button id="download-btn" class="download-btn">画像を保存 (PNG)</button>
  </div>

  <!-- リアルタイムプレビューエリア -->
  <div class="preview-panel">
    <div class="preview-title">リアルタイムプレビュー</div>
    <canvas id="main-canvas"></canvas>
  </div>
</div>

<!-- 一時処理用の非表示領域 -->
<div id="qrcode-hidden"></div>

<script>
  // DOM要素の取得
  const qrTextInput = document.getElementById('qr-text');
  const titleTopLeftInput = document.getElementById('title-top-left');
  const titleBottomRightInput = document.getElementById('title-bottom-right');
  const logoFileInput = document.getElementById('logo-file');
  const logoSizeInput = document.getElementById('logo-size');
  const logoSizeVal = document.getElementById('logo-size-val');
  const downloadBtn = document.getElementById('download-btn');
  const mainCanvas = document.getElementById('main-canvas');
  const hiddenQrDiv = document.getElementById('qrcode-hidden');

  let uploadedImage = null;

  // キャンバスおよび描画パラメータ設定
  const canvasWidth = 400;
  const canvasHeight = 460;
  const qrSize = 320;
  const qrX = (canvasWidth - qrSize) / 2; // 中央配置
  const qrY = 70; // 上部タイトルのためのマージン

  mainCanvas.width = canvasWidth;
  mainCanvas.height = canvasHeight;

  // 描画更新処理
  function updateQRCode() {
    const text = qrTextInput.value.trim();
    if (!text) return;

    // 一時領域のクリア
    hiddenQrDiv.innerHTML = '';

    // QRCode.js でQRコード生成 (誤り訂正レベル H: 最高)
    new QRCode(hiddenQrDiv, {
      text: text,
      width: qrSize,
      height: qrSize,
      colorDark: "#000000",
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.H
    });

    // 生成完了（DOMレンダリング）を待ってCanvasに合成
    setTimeout(() => {
      const qrImg = hiddenQrDiv.querySelector('img');
      if (qrImg) {
        if (qrImg.complete) {
          renderCanvas(qrImg);
        } else {
          qrImg.onload = () => renderCanvas(qrImg);
        }
      }
    }, 50);
  }

  // キャンバス描画メイン処理
  function renderCanvas(qrImg) {
    const ctx = mainCanvas.getContext('2d');

    // 1. 背景描画 (白)
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvasWidth, canvasHeight);

    // 2. QRコード描画
    ctx.drawImage(qrImg, qrX, qrY, qrSize, qrSize);

    // 3. 左上タイトルの描画（欄外）
    const titleTopLeft = titleTopLeftInput.value;
    if (titleTopLeft) {
      ctx.fillStyle = '#000000';
      ctx.font = 'bold 18px sans-serif';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'bottom';
      ctx.fillText(titleTopLeft, qrX, qrY - 12);
    }

    // 4. 右下タイトルの描画（欄外）
    const titleBottomRight = titleBottomRightInput.value;
    if (titleBottomRight) {
      ctx.fillStyle = '#000000';
      ctx.font = 'bold 16px sans-serif';
      ctx.textAlign = 'right';
      ctx.textBaseline = 'top';
      ctx.fillText(titleBottomRight, qrX + qrSize, qrY + qrSize + 12);
    }

    // 5. 中央ロゴの描画
    if (uploadedImage) {
      const scalePercent = parseInt(logoSizeInput.value, 10) / 100;
      const logoWidth = qrSize * scalePercent;
      const logoHeight = (uploadedImage.height / uploadedImage.width) * logoWidth;
      const logoX = qrX + (qrSize - logoWidth) / 2;
      const logoY = qrY + (qrSize - logoHeight) / 2;

      // ロゴ背面用に白枠（背景）を描画してQRコードの誤認識を防ぐ
      const padding = 6;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(
        logoX - padding,
        logoY - padding,
        logoWidth + (padding * 2),
        logoHeight + (padding * 2)
      );

      // ロゴ本体を描画
      ctx.drawImage(uploadedImage, logoX, logoY, logoWidth, logoHeight);
    }
  }

  // イベントリスナー設定（リアルタイム反映）
  qrTextInput.addEventListener('input', updateQRCode);
  titleTopLeftInput.addEventListener('input', updateQRCode);
  titleBottomRightInput.addEventListener('input', updateQRCode);

  logoSizeInput.addEventListener('input', (e) => {
    logoSizeVal.textContent = `${e.target.value}%`;
    updateQRCode();
  });

  logoFileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          uploadedImage = img;
          updateQRCode();
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    } else {
      uploadedImage = null;
      updateQRCode();
    }
  });

  // PNGダウンロード機能
  downloadBtn.addEventListener('click', () => {
    const link = document.createElement('a');
    link.download = 'qrcode_custom.png';
    link.href = mainCanvas.toDataURL('image/png');
    link.click();
  });

  // 初期化実行
  window.onload = () => {
    updateQRCode();
  };
</script>

</body>
</html>
